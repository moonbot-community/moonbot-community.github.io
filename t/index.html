<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>MoonBot · Discord</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0f1117;color:#e8e8ef;font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center}
main{padding:24px}
.btn{display:block;margin:22px auto 14px;padding:18px 28px;max-width:320px;border-radius:14px;background:#5865F2;color:#fff;font-weight:700;font-size:20px;text-decoration:none}
.alt{color:#8ea2ff;font-size:15px}
#log{margin-top:18px;font-size:12px;color:#777}
</style>
</head>
<body>
<main>
<p>Ouverture de l'appli Discord…</p>
<a id="app" class="btn" href="#">Ouvrir Discord</a>
<a id="web" class="alt" href="#">Ouvrir dans le navigateur</a>
<p id="log"></p>
</main>
<script>
(function () {
  // PAGE DE TEST (non utilisée par les pubs) : essaie d'ouvrir l'APPLI Discord automatiquement, sinon bouton.
  var code = (new URLSearchParams(location.search).get('i') || 'px2ZpjG63J').replace(/[^A-Za-z0-9]/g, '');
  var ua = navigator.userAgent || '';
  var android = /Android/i.test(ua), ios = /iPhone|iPad|iPod/i.test(ua);
  var web = 'https://discord.gg/' + code;
  var app = android ? 'intent://discord.gg/' + code + '#Intent;scheme=https;package=com.discord;S.browser_fallback_url=' + encodeURIComponent(web) + ';end'
          : ios ? 'discord://-/invite/' + code : web;
  document.getElementById('app').href = app;
  document.getElementById('web').href = web;
  document.getElementById('log').textContent = (android ? 'Android' : ios ? 'iPhone' : 'ordinateur') + ' · ' + (/Twitter|TwitterAndroid/i.test(ua) ? 'navigateur de X' : 'navigateur');
  // essai automatique (souvent bloqué sans toucher l'écran : le bouton reste là)
  setTimeout(function () { window.location.href = app; }, 300);
})();
</script>
</body>
</html>
